# Гайд «Установка на Mac» на GitHub Pages: https://blashkin.github.io/mk-forge/
#
# Гайд собирается командой mk-forge guide из раздела README, руками не правится.
# Сборка идет в любой ветке, где менялись README или сборщик гайда: разметку,
# которую гайд не умеет, видно до мержа. Публикуется только main.
name: Гайд

on:
  push:
    paths:
      - README.md
      - mkforge/guide.py
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

# Публикацию не прерываем на полпути: следующая встанет за ней.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          version: "0.11.21"
          python-version: "3.12"

      - run: uv sync --locked

      - run: uv run --no-sync mk-forge guide --out "$RUNNER_TEMP/site/index.html"

      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Публикация
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deploy
