# mk-forge: страница «Акция» в контейнере.
#
#   docker compose up -d     запустить; страница — http://127.0.0.1:8765
#   docker compose down      остановить; все остается в томе
#
# Все состояние — данные, ключ обезличивания, конфиги, книги — в томе mk-forge.
# Том удаляется только явно, и с ним пропадает все, что не скачано.
name: mk-forge

services:
  page:
    image: ghcr.io/blashkin/mk-forge:latest
    # Только петля хоста. Это единственное, что закрывает страницу от сети:
    # проверка Host в сервере не спасает от запроса с подставленным заголовком.
    ports:
      - "127.0.0.1:8765:8765"
    volumes:
      - mk-forge:/srv/mk-forge
    environment:
      # Какая акция открыта. Образцы кладутся в пустой том при первом старте.
      MK_FORGE_CONFIG: configs/example_distribution.yaml
    # После перезагрузки страница есть по адресу без команд; ручную остановку
    # контейнер уважает.
    restart: unless-stopped

volumes:
  mk-forge:
